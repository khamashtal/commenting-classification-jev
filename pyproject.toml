[project]
name = "commenting-classification-jev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "mcp>=2.2.0",
    "python-dotenv>=1.2.3",
    "typesafe-sdk>=0.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Installs `clients` and `processing` into the venv (editable, pointing back at src/),
# so imports resolve from any working directory without PYTHONPATH.
packages = ["src/clients", "src/processing"]
